<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RunnerDeck widget</title>
<style>
  :root {
    --card: rgba(255, 255, 255, .86); --border: rgba(16, 24, 40, .10); --text: #1b1f27; --muted: #5b6474; --track: rgba(16, 24, 40, .08);
    --ok: #12a150; --warn: #d97706; --bad: #dc2626; --s1: #2f6fed; --s2: #9b51e0; --tc: #0ea5a4;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root { --card: rgba(18, 23, 31, .86); --border: rgba(255, 255, 255, .09); --text: #e8ebf1; --muted: #9aa4b2; --track: rgba(255, 255, 255, .08);
      --ok: #34c77b; --warn: #f0a33a; --bad: #f05252; --s1: #5b8def; --s2: #b27cf0; --tc: #2cc5c3; color-scheme: dark; }
  }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; cursor: default; }
  body { text-transform: capitalize; font: 12.5px/1.35 "Segoe UI Variable Text", "Segoe UI", -apple-system, BlinkMacSystemFont, system-ui, sans-serif; color: var(--text); padding: 6px; box-sizing: border-box; }
  .card { height: 100%; box-sizing: border-box; border-radius: 14px; background: var(--card); border: 1px solid var(--border);
          backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); padding: 10px 12px; display: flex; flex-direction: column; gap: 7px;
          box-shadow: 0 6px 20px rgba(0, 0, 0, .18); }
  .head { display: flex; align-items: center; gap: 7px; }
  .head img { width: 18px; height: 18px; }
  .head b { font-weight: 650; font-size: 13px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
  .dot.stale { background: var(--bad); }
  .open { text-transform: inherit; margin-left: auto; border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 12px; padding: 2px 6px; border-radius: 6px; cursor: pointer; }
  .open:hover { background: var(--track); color: var(--text); }
  .row { display: grid; grid-template-columns: 8px 1fr auto 74px; align-items: center; gap: 7px; }
  .sw { width: 8px; height: 8px; border-radius: 2px; }
  .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .state { color: var(--muted); font-size: 11.5px; white-space: nowrap; }
  .state.run { color: var(--ok); font-weight: 600; }
  .state.off { color: var(--warn); font-weight: 600; }
  .cpu { display: flex; align-items: center; gap: 5px; justify-content: flex-end; font-variant-numeric: tabular-nums; }
  .bar { width: 30px; height: 5px; border-radius: 99px; background: var(--track); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 99px; }
  .foot { margin-top: auto; display: flex; justify-content: space-between; color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; border-top: 1px solid var(--border); padding-top: 6px; }
  .msg { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<div class="card" data-tauri-drag-region>
  <div class="head" data-tauri-drag-region>
    <img src="logo.png" alt="" data-tauri-drag-region>
    <b data-tauri-drag-region>RunnerDeck</b>
    <span class="dot" id="dot" data-tauri-drag-region></span>
    <button class="open" id="open" title="Open RunnerDeck">Open ↗</button>
  </div>
  <div id="rows" data-tauri-drag-region><div class="msg" data-tauri-drag-region>Connecting…</div></div>
  <div class="foot" data-tauri-drag-region><span id="cpu" data-tauri-drag-region>CPU –</span><span id="disk" data-tauri-drag-region>Disk –</span></div>
</div>
<script src="widget.js"></script>
</body>
</html>
